---
install_files:
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'files/gitlab_gitlab-ce-archive-keyring.gpg'
    #dest:               '/etc/apt/keyrings/gitlab_gitlab-ce-archive-keyring.gpg'
    dest:               '/usr/share/keyrings/gitlab_gitlab-ce-archive-keyring.asc'
template_files:
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'templates/gitlab.com.sources.j2'
    dest:               '/etc/apt/sources.list.d/gitlab.com.sources'
install_packages:
  - 'gitlab-ce'
